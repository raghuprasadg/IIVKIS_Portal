{{- /*
IIVKIS Helm Chart — Orchestrator Deployment
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iivkis.fullname" . }}-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iivkis.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.replicaCount.orchestrator }}
  selector:
    matchLabels:
      {{- include "iivkis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "iivkis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: {{ include "iivkis.serviceAccountName" . }}
      containers:
        - name: orchestrator
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.orchestrator.repository }}:{{ .Values.image.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.orchestrator.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.service.orchestrator.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iivkis-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: iivkis-secrets
                  key: redis-url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.orchestrator | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iivkis.fullname" . }}-orchestrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iivkis.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: {{ .Values.service.orchestrator.type }}
  ports:
    - port: {{ .Values.service.orchestrator.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "iivkis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
