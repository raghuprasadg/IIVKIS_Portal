{{- /*
IIVKIS Helm Chart — ServiceAccount, NetworkPolicy, PodDisruptionBudget
*/ -}}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iivkis.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iivkis.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iivkis.fullname" . }}-allow-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iivkis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iivkis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        - podSelector:
            matchLabels:
              {{- include "iivkis.selectorLabels" . | nindent 14 }}
  egress:
    - {}  # Allow all egress (DNS, external APIs)
{{- end }}

---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "iivkis.fullname" . }}-api-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iivkis.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "iivkis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
