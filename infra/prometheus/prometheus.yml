global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: local
    project: iivkis

# ─── Alerting ────────────────────────────────────────────────────────────────
# (Alertmanager not included in local-dev; add as a separate service when needed)
alerting:
  alertmanagers: []

# ─── Rule files ──────────────────────────────────────────────────────────────
rule_files: []

# ─── Scrape configurations ────────────────────────────────────────────────────
scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # IIVKIS API — Express app exposing /metrics via prom-client (added in later step)
  - job_name: iivkis-api
    static_configs:
      - targets:
          - api:4000
    metrics_path: /metrics
    scrape_interval: 15s

  # Grafana metrics endpoint
  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3001
    metrics_path: /metrics
    scrape_interval: 30s

  # Keycloak metrics (enabled via KC_METRICS_ENABLED=true)
  - job_name: keycloak
    static_configs:
      - targets:
          - keycloak:9000
    metrics_path: /metrics
    scrape_interval: 30s
