  <path d="M22 12L31.5 17.5V28C31.5 34.2 27 39.5 22 41.5C17 39.5 12.5 34.2 12.5 28V17.5L22 12Z"
        stroke="url(#n_acc)" stroke-width="1.8" fill="none"/>
  <!-- Network nodes -->
  <circle cx="22" cy="21" r="2.6" fill="#DDF9FF"/>
  <circle cx="17" cy="29" r="2"   fill="#DDF9FF"/>
  <circle cx="27" cy="29" r="2"   fill="#DDF9FF"/>
  <circle cx="22" cy="36" r="2.2" fill="#DDF9FF"/>
  <!-- Edges -->
  <path d="M22 23.6V33.8"         stroke="#DDF9FF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M20.4 22.4L18 27"      stroke="#DDF9FF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M23.6 22.4L26 27"      stroke="#DDF9FF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M18.6 30.5L20.8 33.8"  stroke="#DDF9FF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M25.4 30.5L23.2 33.8"  stroke="#DDF9FF" stroke-width="1.4" stroke-linecap="round"/>

