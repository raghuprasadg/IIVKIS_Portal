  <text x="53" y="29"
        fill="#FFFFFF"
        font-family="'Segoe UI', Inter, Arial, sans-serif"
        font-size="20"
        font-weight="700"
        letter-spacing="2">IIVKIS</text>

  <!-- Sub label -->
  <text x="54" y="43"
        fill="#00d4ff"
        font-family="'Segoe UI', Inter, Arial, sans-serif"
