<svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="n_bg" x1="0" y1="4" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0AA3D6"/>
      <stop offset="1" stop-color="#0F6FB5"/>
    </linearGradient>
    <linearGradient id="n_acc" x1="8" y1="12" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BE5FF"/>
      <stop offset="1" stop-color="#0FC2E8"/>
    </linearGradient>
    <filter id="n_glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="screen"/>
    </filter>
  </defs>

  <!-- Shield emblem (44×44, y-offset 4 to vertically centre in 52px) -->
